name: Feature request
description: An idea for the card.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This card stays simple on purpose. I build and look after it in my spare time, so I can't promise every idea, but they're all read.
  - type: textarea
    id: idea
    attributes:
      label: What would you like it to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help you?
